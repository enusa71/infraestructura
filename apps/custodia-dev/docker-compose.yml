services:
  app:
    build: .
    container_name: custodia-dev-app
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=development
    volumes:
      - .:/opt/custodia
      - /opt/custodia/node_modules
      - /opt/custodia/.next
    command: sh -c "npx prisma generate && npm run dev"
    networks:
      - laboratorio_laboratorio-net
    depends_on:
      - gotenberg
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: custodia-dev-gotenberg
    ports:
      - "3001:3000"
    networks:
      - laboratorio_laboratorio-net
    restart: unless-stopped

networks:
  laboratorio_laboratorio-net:
    external: true

services:
  # Servicio Nginx
  web:
    image: nginx:latest
    container_name: laboratorio-nginx
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - laboratorio-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servicio PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: laboratorio-postgres
    environment:
      POSTGRES_USER: custodia
      POSTGRES_PASSWORD: custodia123
      POSTGRES_DB: custodia_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - laboratorio-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custodia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio Portainer
  portainer:
    image: portainer/portainer-ce:latest
    container_name: laboratorio-portainer
    ports:
      - "9000:9000"
      - "8443:8443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - laboratorio-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  laboratorio-net:
    driver: bridge

volumes:
  postgres-data:
  portainer-data:

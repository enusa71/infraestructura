
services:
  # Servicio Nginx
  web:
    image: nginx:latest
    container_name: laboratorio-nginx
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - laboratorio-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  laboratorio-net:
    driver: bridge
